name: Extract ELVRA ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'ZIP file name inside the repository'
        required: true
        default: 'ELVRA-v2-stable.zip'
  push:
    paths:
      - '*.zip'
      - '.github/workflows/extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select ZIP
        id: zip
        shell: bash
        run: |
          ZIP_NAME="${{ github.event.inputs.zip_name }}"
          if [ -z "$ZIP_NAME" ]; then ZIP_NAME="ELVRA-v2-stable.zip"; fi
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP exists
        shell: bash
        run: |
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP file not found: $ZIP_NAME"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

      - name: Extract ZIP outside repository
        shell: bash
        run: |
          rm -rf /tmp/elvra_extract
          mkdir -p /tmp/elvra_extract
          unzip -oq "${{ steps.zip.outputs.zip_name }}" -d /tmp/elvra_extract

      - name: Replace project files
        shell: bash
        run: |
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP_NAME" \
            -exec rm -rf {} +
          rsync -a /tmp/elvra_extract/ ./
          rm -rf /tmp/elvra_extract

      - name: Keep workflow
        shell: bash
        run: |
          test -f .github/workflows/extract.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Extract ELVRA v2 project'
          git push
          
