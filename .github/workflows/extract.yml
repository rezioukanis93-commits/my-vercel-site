name: Deploy ELVRA to Vercel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ELVRA ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_NAME="ELVRA-v2-stable.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: $ZIP_NAME not found"
            exit 1
          fi

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract ELVRA project
        shell: bash
        run: |
          rm -rf /tmp/elvra_extract
          mkdir -p /tmp/elvra_extract

          unzip -q "${{ steps.find_zip.outputs.zip_name }}" -d /tmp/elvra_extract

          echo "Extracted files:"
          find /tmp/elvra_extract -maxdepth 2 -type f | head -100

      - name: Replace project files
        shell: bash
        run: |
          shopt -s dotglob

          for item in /tmp/elvra_extract/*; do
            name="$(basename "$item")"

            if [ "$name" = ".github" ]; then
              continue
            fi

            rm -rf "$name"
            cp -a "$item" .
          done

      - name: Commit ELVRA project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # لا نسمح للـ GitHub Action بتعديل workflow نفسه
          git reset -- .github/workflows/extract.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Deploy ELVRA v2 project"

      - name: Push changes
        shell: bash
        run: |
          git push origin HEAD:main          
